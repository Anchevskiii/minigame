name: CI Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  quality-and-tests:
    name: Lint, Build & Acceptance Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: redacted_minigame
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 with caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Linting check (Oxlint)
        run: npm run lint

      - name: Generate Prisma Client & Push Schema
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/redacted_minigame?schema=public
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/redacted_minigame?schema=public
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npx prisma db seed

      - name: TypeScript & Vite Build
        run: npm run build

      - name: Run E2E Acceptance & Game Logic Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/redacted_minigame?schema=public
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/redacted_minigame?schema=public
          JWT_SECRET: ci-pipeline-test-jwt-secret-key-32chars-minimum-safe
        run: npm test
