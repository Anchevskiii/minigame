<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .block { fill: #1e293b; }
      .btn { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .btn-dark { fill: #1e293b; stroke: #1e293b; stroke-width: 1.5; }
      .line { stroke: #64748b; stroke-width: 2; stroke-linecap: round; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .text-body { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #1e293b; dominant-baseline: central; }
      .text-btn { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .text-btn-white { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1000" height="650" class="bg"/>

  <!-- GLAVA -->
  <rect x="20" y="20" width="960" height="45" class="box"/>
  <text x="60" y="42" class="text-title">REDACTED</text>
  <rect x="120" y="30" width="60" height="25" class="box"/>
  <text x="150" y="42" class="text-title">DAN 42</text>

  <g transform="translate(630, 29)">
    <rect x="0" y="0" width="70" height="27" class="btn"/>
    <text x="35" y="13" class="text-btn">PRAVILA</text>

    <rect x="80" y="0" width="80" height="27" class="btn"/>
    <text x="120" y="13" class="text-btn">STATISTIKA</text>

    <rect x="170" y="0" width="70" height="27" class="btn"/>
    <text x="205" y="13" class="text-btn">ARHIV</text>

    <rect x="250" y="0" width="80" height="27" class="btn-dark"/>
    <text x="290" y="13" class="text-btn-white">PROFIL</text>
  </g>

  <!-- DOKUMENT -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="670" height="480" class="box"/>

    <!-- Cenzuriran naslov -->
    <rect x="30" y="30" width="120" height="26" class="block"/>
    <rect x="160" y="30" width="150" height="26" class="block"/>

    <!-- 1. Odstavek s črtami in cenzuriranimi bloki -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="70" height="14" class="block"/>
      <line x1="80" y1="7" x2="160" y2="7" class="line"/>
      <rect x="170" y="0" width="90" height="14" class="block"/>
      <line x1="270" y1="7" x2="420" y2="7" class="line"/>
      <rect x="430" y="0" width="80" height="14" class="block"/>
      <line x1="520" y1="7" x2="610" y2="7" class="line"/>

      <line x1="0" y1="28" x2="90" y2="28" class="line"/>
      <rect x="100" y="21" width="110" height="14" class="block"/>
      <line x1="220" y1="28" x2="380" y2="28" class="line"/>
      <rect x="390" y="21" width="60" height="14" class="block"/>
      <line x1="460" y1="28" x2="610" y2="28" class="line"/>

      <rect x="0" y="42" width="100" height="14" class="block"/>
      <line x1="110" y1="49" x2="350" y2="49" class="line"/>
      <rect x="360" y="42" width="90" height="14" class="block"/>
      <line x1="460" y1="49" x2="570" y2="49" class="line"/>
    </g>

    <!-- 2. Odstavek -->
    <g transform="translate(30, 185)">
      <line x1="0" y1="7" x2="120" y2="7" class="line"/>
      <rect x="130" y="0" width="80" height="14" class="block"/>
      <line x1="220" y1="7" x2="360" y2="7" class="line"/>
      <rect x="370" y="0" width="100" height="14" class="block"/>
      <line x1="480" y1="7" x2="610" y2="7" class="line"/>

      <rect x="0" y="21" width="130" height="14" class="block"/>
      <line x1="140" y1="28" x2="280" y2="28" class="line"/>
      <rect x="290" y="21" width="90" height="14" class="block"/>
      <line x1="390" y1="28" x2="550" y2="28" class="line"/>
    </g>

    <!-- 3. Odstavek -->
    <g transform="translate(30, 265)">
      <line x1="0" y1="7" x2="200" y2="7" class="line"/>
      <rect x="210" y="0" width="90" height="14" class="block"/>
      <line x1="310" y1="7" x2="480" y2="7" class="line"/>
      <rect x="490" y="0" width="120" height="14" class="block"/>

      <line x1="0" y1="28" x2="160" y2="28" class="line"/>
      <rect x="170" y="21" width="110" height="14" class="block"/>
      <line x1="290" y1="28" x2="580" y2="28" class="line"/>

      <rect x="0" y="42" width="90" height="14" class="block"/>
      <line x1="100" y1="49" x2="390" y2="49" class="line"/>
    </g>

    <!-- 4. Odstavek -->
    <g transform="translate(30, 350)">
      <line x1="0" y1="7" x2="150" y2="7" class="line"/>
      <rect x="160" y="0" width="80" height="14" class="block"/>
      <line x1="250" y1="7" x2="430" y2="7" class="line"/>
      <rect x="440" y="0" width="110" height="14" class="block"/>
      <line x1="0" y1="28" x2="340" y2="28" class="line"/>
    </g>
  </g>

  <!-- STRANSKA VRSTICA -->
  <g transform="translate(710, 80)">
    <rect x="0" y="0" width="270" height="480" class="box"/>

    <text x="70" y="30" class="text-title">ZGODOVINA</text>

    <!-- Zavihka -->
    <rect x="20" y="50" width="110" height="26" class="btn-dark"/>
    <text x="75" y="63" class="text-btn-white">VSI 14</text>

    <rect x="140" y="50" width="110" height="26" class="btn"/>
    <text x="195" y="63" class="text-btn">ZADETKI 5</text>

    <!-- Vrstice zgodovine -->
    <g transform="translate(20, 95)">
      <rect x="0" y="0" width="230" height="32" class="box"/>
      <text x="15" y="16" class="text-body">14 PHYSICS</text>
      <text x="190" y="16" class="text-title">12</text>

      <rect x="0" y="40" width="230" height="32" class="box"/>
      <text x="15" y="56" class="text-body">13 THEORY</text>
      <text x="190" y="56" class="text-title">4</text>

      <rect x="0" y="80" width="230" height="32" class="box"/>
      <text x="15" y="96" class="text-body">12 GERMANY</text>
      <text x="190" y="96" class="text-body">0</text>

      <rect x="0" y="120" width="230" height="32" class="box"/>
      <text x="15" y="136" class="text-body">11 RELATIVITY</text>
      <text x="190" y="136" class="text-title">7</text>

      <rect x="0" y="160" width="230" height="32" class="box"/>
      <text x="15" y="176" class="text-body">10 SPACE</text>
      <text x="190" y="176" class="text-body">0</text>

      <rect x="0" y="200" width="230" height="32" class="box"/>
      <text x="15" y="216" class="text-body">9 NOBEL</text>
      <text x="190" y="216" class="text-title">2</text>
    </g>
  </g>

  <!-- SPODNJA VRSTICA -->
  <g transform="translate(20, 580)">
    <rect x="0" y="0" width="960" height="50" class="box"/>

    <text x="30" y="25" class="text-body">POSKUSI 14</text>
    <text x="130" y="25" class="text-body">ZADETKI 5</text>

    <!-- Vnosno polje -->
    <rect x="230" y="10" width="400" height="30" class="box"/>
    <line x1="245" y1="25" x2="350" y2="25" class="line"/>

    <rect x="640" y="10" width="100" height="30" class="btn-dark"/>
    <text x="690" y="25" class="text-btn-white">UGIBAJ</text>

    <rect x="850" y="10" width="90" height="30" class="btn"/>
    <text x="895" y="25" class="text-btn">NAMIG</text>
  </g>
</svg>
